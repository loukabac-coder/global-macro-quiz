name: Mise à jour des capitalisations

on:
  schedule:
    - cron: "20 6 * * *"   # tous les jours à 06h20 UTC
  workflow_dispatch:        # permet aussi de le lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/update_market_caps.py
      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "market-caps-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/market-caps.json
          git diff --staged --quiet || (git commit -m "Capitalisations du jour" && git push)
