name: Données du jour

on:
  schedule:
    - cron: "11 7 * * *"
      timezone: "Europe/Paris"
    - cron: "41 18 * * *"
      timezone: "Europe/Paris"
    - cron: "17,47 8-23 * * 1-5"
      timezone: "Europe/Paris"
    - cron: "32 9-23 * * 1-5"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-publication
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install yfinance==1.8.0
      - name: Charger les dernières observations publiées
        run: |
          if git ls-remote --exit-code origin refs/heads/data-live > /dev/null; then
            git fetch --no-tags --depth=1 origin refs/heads/data-live:refs/remotes/origin/data-live
            for file in public/data/macro.json public/data/market-caps.json public/data/actualite.json public/data/production.json; do
              if git cat-file -e "origin/data-live:$file"; then
                git show "origin/data-live:$file" > "$file"
              fi
            done
          elif [ "$?" -ne 2 ]; then
            exit 1
          fi
      - name: Capitalisations
        id: caps
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '32 9-23 * * 1-5' || github.event.schedule == '11 7 * * *' || github.event.schedule == '41 18 * * *'
        continue-on-error: true
        run: timeout 8m python scripts/update_market_caps.py
      - name: Indicateurs macro
        id: macro
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17,47 8-23 * * 1-5' || github.event.schedule == '11 7 * * *' || github.event.schedule == '41 18 * * *'
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = '17,47 8-23 * * 1-5' ]; then
            timeout 5m python scripts/update_macro.py --intraday
          else
            timeout 5m python scripts/update_macro.py
          fi
      - name: Préparer la lecture des publications officielles PDF
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '11 7 * * *' || github.event.schedule == '41 18 * * *'
        run: python -m pip install pypdf==7.0.1
      - name: Actualité, dirigeants et décisions monétaires
        id: news
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '11 7 * * *' || github.event.schedule == '41 18 * * *'
        continue-on-error: true
        run: timeout 3m python -m scripts.update_news
      - name: Production, réserves et exportations
        id: production
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '11 7 * * *' || github.event.schedule == '41 18 * * *'
        continue-on-error: true
        run: timeout 8m python -m scripts.update_production
      - name: Publier les fichiers sur la branche data-live
        run: |
          target="$RUNNER_TEMP/data-live"
          if git show-ref --verify --quiet refs/remotes/origin/data-live; then
            git worktree add --detach "$target" origin/data-live
          else
            git worktree add --detach "$target" HEAD
          fi
          cp public/data/macro.json public/data/market-caps.json public/data/actualite.json public/data/production.json "$target/public/data/"
          cp vercel.json "$target/"
          git -C "$target" add public/data/macro.json public/data/market-caps.json public/data/actualite.json public/data/production.json vercel.json
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Actualisation des données de marché"
          fi
          git -C "$target" push origin HEAD:refs/heads/data-live
      - name: Signaler les collectes en échec
        if: steps.caps.outcome == 'failure' || steps.macro.outcome == 'failure' || steps.news.outcome == 'failure' || steps.production.outcome == 'failure'
        run: exit 1
